# Rose Pine Moon
#
# A dark red build: terracotta #d3685b as the accent on a near-black
# field, derived from a wallpaper. The seeds were #111016 (background),
# #D3685B (accent), #90363B (danger) and #c3c3c4 (text); the surface and
# text ramps below were generated from them and written out in full.
#
# The source is warm end to end, so every colour in it lands within ~20
# degrees of the accent. The playhead and out-point -- the two marks that
# must never be confused with the selection -- are therefore cool,
# against the rest of the palette. A red playhead over a terracotta
# selection is invisible, and a marker that cannot be seen on the range
# being trimmed has failed at its only job.

[dark]

# Surfaces
canvas               = "#14131a"
surface              = "#1f1e29"
surface_raised       = "#322f40"
surface_sunken       = "#0f0f14"
surface_sunken_alt   = "#0b0a0e"
letterbox            = "#000000"

# Structure
border               = "#363346"
border_raised        = "#49445e"

# Accent: the terracotta the image is built on
accent               = "#d3685b"
accent_hover         = "#db857b"
on_accent            = "#0d0c11"
accent_tint_bg       = "#392421"
accent_tint_text     = "#d2675a"

# Controls
control_knob         = "#ffffff"
control_track_off    = "#7d798d"

# Text
text_primary         = "#c3c3c4"
text_secondary       = "#88859a"
text_secondary_alt   = "#aaa7b6"
text_muted           = "#88859a"
text_muted_alt       = "#77738b"
surface_hover        = "#2b2838"

# Semantic
success              = "#39c568"
danger               = "#d76269"
origin_mark          = "#aaa7b6"

# Stage: drawn on or beside the picture
trim_track           = "#0d0c11"
trim_range_fill      = "#d3685b"
trim_range_edge      = "#ffffff"
trim_range_excluded  = "#ffffff0f"
playhead             = "#6fc7e0"
mute                 = "#6fc7e0"
trim_out             = "#c8e04f"
trim_out_hover       = "#d7e97a"
stage_badge_text     = "#ffffff"
stage_badge_text_dim = "#c6c6c6"
stage_shadow         = "#0000008c"
waveform             = "#4d4964"
mute_border          = "#592b2d"
