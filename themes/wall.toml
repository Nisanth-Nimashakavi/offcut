# Derived from a wallpaper.
#
# Two colours are required: the one the image mostly is, and the one that
# stands out of it. The other four refine the marks drawn on the picture
# and are only honoured when they are recognisably that colour — a warm
# brown offered as `success` is not a green, and taking it at face value
# would produce three identical reds.
#
# All 37 roles are generated from these: the surface ramp, text solved to
# its contrast floor, and the stage marks held apart in hue. Anything in
# a [dark] or [light] section below still wins, role by role.

[wallpaper]
background = "#111016"   # the near-black field
accent     = "#D3685B"   # the terracotta the image is built on
danger     = "#90363B"   # deep red
success    = "#654847"   # ignored: a brown, not a green — see above
text       = "#c3c3c4"   # the light grey in the image

# ---- The one thing a warm wallpaper cannot supply ----
#
# The trim bar draws three things that must never be confused: the kept
# range (the accent), the current frame, and the out-point handle. This
# wallpaper is warm end to end, so every colour in it lands within ~20
# degrees of the accent — the app reports exactly this if these two lines
# are removed:
#
#   `trim_range_fill` and `playhead` are 10° apart in hue (want 60°)
#   `trim_range_fill` and `trim_out` are 14° apart in hue (want 60°)
#
# The accent keeps the wallpaper's colour, because that is the whole
# point, so the two marks move instead. Red for the playhead is a
# convention worth breaking here: a red marker over a terracotta
# selection is invisible, and a marker that cannot be seen on the range
# being trimmed has failed at its only job.

[dark]
playhead = "#6fc7e0"   # 173° from the accent, 10.1:1 on the well
mute     = "#6fc7e0"
trim_out = "#c8e04f"   # 64° from the accent, 123° from the playhead

[light]
playhead = "#6fc7e0"
mute     = "#6fc7e0"
trim_out = "#c8e04f"
