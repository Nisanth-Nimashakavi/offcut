description = "Timeline -> encoded MP4. Per-clip segment pipelines with crop/adjust/speed applied, concatenated and encoded once (PLAN.md §4.4)."

[dependencies]
offcut-model = { path = "../offcut-model" }
offcut-engine = { path = "../offcut-engine" }
offcut-render = { path = "../offcut-render" }
pollster = "0.4"
gstreamer = { version = "0.25.3", features = ["v1_28"] }
gstreamer-app = "0.25.2"
gstreamer-video = { version = "0.25.3", features = ["v1_28"] }
thiserror.workspace = true

[dev-dependencies]
